name: Simple Calculator CI

# Run automatically whenever code is pushed to the main branch (Steps 6 & 7)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Calculator Unit Tests (Step 8)
        run: node test/calculator.test.js
