<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator | Muhammad Affaf Abdullah</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
</head>
<body>
  <main class="calculator-app">
    <header class="app-header">
      <h1 class="app-title">Calculator</h1>
    </header>

    <div class="calculator" role="region" aria-label="Calculator">
      <!-- Screen display -->
      <div class="display">
        <div class="display-history" id="display-history" aria-live="polite"></div>
        <div class="display-current" id="display-current" aria-live="polite">0</div>
      </div>

      <!-- Keypad -->
      <div class="keypad" role="group" aria-label="Calculator keypad">
        <!-- Row 1 -->
        <button type="button" class="btn btn-util" data-action="all-clear" title="All Clear (Esc)">AC</button>
        <button type="button" class="btn btn-util" data-action="clear-entry" title="Clear Entry (Delete)">C</button>
        <button type="button" class="btn btn-util" data-action="backspace" title="Backspace (Backspace)">⌫</button>
        <button type="button" class="btn btn-op" data-operator="÷" title="Divide (/)">÷</button>

        <!-- Row 2 -->
        <button type="button" class="btn btn-num" data-number="7">7</button>
        <button type="button" class="btn btn-num" data-number="8">8</button>
        <button type="button" class="btn btn-num" data-number="9">9</button>
        <button type="button" class="btn btn-op" data-operator="×" title="Multiply (*)">×</button>

        <!-- Row 3 -->
        <button type="button" class="btn btn-num" data-number="4">4</button>
        <button type="button" class="btn btn-num" data-number="5">5</button>
        <button type="button" class="btn btn-num" data-number="6">6</button>
        <button type="button" class="btn btn-op" data-operator="-" title="Subtract (-)">−</button>

        <!-- Row 4 -->
        <button type="button" class="btn btn-num" data-number="1">1</button>
        <button type="button" class="btn btn-num" data-number="2">2</button>
        <button type="button" class="btn btn-num" data-number="3">3</button>
        <button type="button" class="btn btn-op" data-operator="+" title="Add (+)">+</button>

        <!-- Row 5 -->
        <button type="button" class="btn btn-util" data-action="toggle-sign" title="Negate (±)">±</button>
        <button type="button" class="btn btn-num" data-number="0">0</button>
        <button type="button" class="btn btn-num" data-action="decimal" title="Decimal Point (.)">.</button>
        <button type="button" class="btn btn-op btn-equals" data-action="calculate" title="Equals (Enter)">=</button>
      </div>
    </div>

    <footer class="app-footer">
      <p class="student-id">Muhammad Affaf Abdullah &middot; FA25-BCS-003</p>
      <p class="course-info">COMSATS University Islamabad, Wah Campus &middot; Software Engineering</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
